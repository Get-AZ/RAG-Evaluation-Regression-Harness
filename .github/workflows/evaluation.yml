name: RAG evaluation harness checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Check candidate against frozen synthetic baseline
        run: |
          python -m harness.evaluate run --demo --corpus data/demo/corpus.json --cases data/demo/cases.json --out reports/candidate.json
          python -m harness.evaluate compare --baseline data/demo/baseline.json --candidate reports/candidate.json
      - name: Prove deliberately broken retrieval fails the gate
        shell: bash
        run: |
          python -m harness.evaluate run --demo --mode empty --corpus data/demo/corpus.json --cases data/demo/cases.json --out reports/broken.json
          set +e
          python -m harness.evaluate compare --baseline data/demo/baseline.json --candidate reports/broken.json
          result=$?
          set -e
          test "$result" -eq 1
